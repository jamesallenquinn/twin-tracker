name: Twin Tracker backend

on:
  schedule:
    - cron: "*/10 * * * *"   # best-effort restart; the job itself loops internally every 2 min for ~5.5h
  workflow_dispatch:          # allow manual runs (and dry runs)
    inputs:
      dry_run:
        description: "Dry run (no pushes sent, no SNOO writes)"
        type: boolean
        default: true
      mode:
        description: "Run mode"
        type: choice
        default: default
        options: [default, snoo-discover]
      loop_seconds:
        description: "Override loop duration in seconds (blank = default)"
        type: string
        default: ""

concurrency:
  group: twin-tracker-backend
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # allow the internal ~5.5h loop to run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend deps
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Run backend
        working-directory: backend
        env:
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          MODE: ${{ inputs.mode || 'default' }}
          LOOP_SECONDS: ${{ inputs.loop_seconds }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SNOO_EMAIL: ${{ secrets.SNOO_EMAIL }}
          SNOO_PASSWORD: ${{ secrets.SNOO_PASSWORD }}
        run: node sender.js
