name: Twin Tracker backend

on:
  schedule:
    - cron: "*/5 * * * *"    # fires ~every 5 min; each run does 3 passes 2 min apart (~2-min effective cadence)
  workflow_dispatch:          # allow manual runs (and dry runs)
    inputs:
      dry_run:
        description: "Dry run (no pushes sent, no SNOO writes)"
        type: boolean
        default: true
      mode:
        description: "Run mode"
        type: choice
        default: default
        options: [default, snoo-discover]

concurrency:
  group: twin-tracker-backend
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend deps
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Run backend
        working-directory: backend
        env:
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          MODE: ${{ inputs.mode || 'default' }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SNOO_EMAIL: ${{ secrets.SNOO_EMAIL }}
          SNOO_PASSWORD: ${{ secrets.SNOO_PASSWORD }}
        run: |
          # GitHub cron fires ~every 5 min; run 3 passes 2 min apart for an effective ~2-min cadence.
          passes=1
          if [ "${{ github.event_name }}" = "schedule" ]; then passes=3; fi
          for i in $(seq 1 $passes); do
            echo "::group::pass $i/$passes"
            node sender.js || true
            echo "::endgroup::"
            if [ "$i" -lt "$passes" ]; then sleep 120; fi
          done
